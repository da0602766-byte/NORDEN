        extend: {

            grafite: '#1F1F23',

              DEFAULT: '#8E6B47',

              soft: '#E7E2DB',

    :root {

      --color-soft-stone: #E7E2DB;
    }

    body {

      color: var(--color-soft-stone);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar refinada em Grafite e Bronze */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0B0D;
    }
    ::-webkit-scrollbar-thumb {
      background: #333338;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8E6B47;
    }

    /* Animações suaves com respeito a prefers-reduced-motion */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-view {
      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-view, * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Estilo editorial para linhas divisórias */

      border-color: rgba(140, 129, 118, 0.18);
    }

    // --------------------------------------------------------------------------
    // 2. UTILITÁRIOS DE FORMATAÇÃO, DATAS E IDEMPOTÊNCIA
    // --------------------------------------------------------------------------
    function formatBRL(cents) {
      const value = (Number(cents) || 0) / 100;
      return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function getTodayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '-';
      const parts = isoDate.split('T')[0].split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatDateTimeBR(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function genId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;

      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.users && parsed.services && parsed.products) return parsed;
        }
      } catch (e) {
        console.warn('Falha ao ler localStorage, restaurando seed demo.', e);
      }
      const initial = createInitialDB();
      saveDB(initial);
      return initial;
    }

    function saveDB(data = db) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('Falha ao salvar localStorage:', e);
      }
    }

    function resetDemoData() {
      db = createInitialDB();
      saveDB();
      bookingDraft = { step: 1, serviceId: null, professionalId: null, preferredProductIds: [], date: getTodayISO(1), startTime: null };
      showToast('Dados demonstrativos restaurados com sucesso.', 'success');
      navigate('landing');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const id = genId('toast');
      const borderClass = type === 'error' ? 'border-red-500/50' : type === 'success' ? 'border-bronze' : 'border-taupe/40';
      const dotClass = type === 'error' ? 'bg-red-400' : type === 'success' ? 'bg-bronze-pale' : 'bg-stone-soft';

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto bg-grafite border ${borderClass} text-stone-soft px-4 py-3 rounded-xl shadow-premium flex items-start gap-3 text-sm animate-view`;
      el.innerHTML = `
        <span class="w-2 h-2 rounded-full ${dotClass} mt-1.5 shrink-0"></span>
        <span class="flex-1 leading-snug">${escapeHTML(message)}</span>
        <button onclick="this.parentElement.remove()" class="text-taupe hover:text-stone-soft text-xs">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => {
        if (el && el.parentElement) el.remove();
      }, 4200);
    }

      card.innerHTML = htmlContent;
      root.classList.remove('hidden');

    function closeModal() {

    // --------------------------------------------------------------------------
    // 6. REGRAS DE NEGÓCIO: AGENDA & MOTOR DETERMINÍSTICO NORDEN FLOW
    // --------------------------------------------------------------------------
    function getAvailableSlots(professionalId, date, durationMin, ignoreBookingId = null) {
      const prof = db.professionals.find((p) => p.id === professionalId && p.active);
      if (!prof) return [];

      const todayStr = getTodayISO(0);
      if (date < todayStr) return [];

      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const startWork = timeToMinutes(prof.workStart);
      const endWork = timeToMinutes(prof.workEnd);
      const step = 15; // grade de 15 em 15 minutos

      // Ocupações: reservas ativas (não canceladas) + bloqueios
      const occupied = [];
      db.bookings.forEach((b) => {
        if (b.id === ignoreBookingId) return;
        if (b.professionalId === professionalId && b.date === date && ['CONFIRMADO', 'EM_ATENDIMENTO', 'CONCLUIDO'].includes(b.status)) {
          const s = timeToMinutes(b.startTime);
          occupied.push([s, s + b.frozenDurationMin]);
        }
      });

      db.scheduleBlocks.forEach((blk) => {
        if (blk.professionalId === professionalId && blk.date === date) {
          occupied.push([timeToMinutes(blk.startTime), timeToMinutes(blk.endTime)]);
        }
      });

      const slots = [];
      for (let t = startWork; t + durationMin <= endWork; t += step) {
        if (date === todayStr && t <= nowMinutes + 15) continue;
        const candidateEnd = t + durationMin;
        // Intervalos semiabertos [início, fim)
        const hasConflict = occupied.some(([os, oe]) => t < oe && candidateEnd > os);
        if (!hasConflict) {
          slots.push(minutesToTime(t));
        }
      }
      return slots;
    }

    // Motor Determinístico NORDEN Flow
    function computeFlowSuggestions() {
      const todayStr = getTodayISO(0);
      const cancelledWindows = db.bookings.filter((b) => b.status === 'CANCELADO' && b.date >= todayStr);

      return cancelledWindows.map((cw) => {
        const prof = db.professionals.find((p) => p.id === cw.professionalId);
        const windowStartMin = timeToMinutes(cw.startTime);
        const windowEndMin = windowStartMin + cw.frozenDurationMin;

        // Verifica se a janela ainda está livre (ninguém ocupou no meio tempo)
        const stillOccupied = db.bookings.some((b) => {
          if (b.professionalId !== cw.professionalId || b.date !== cw.date) return false;
          if (!['CONFIRMADO', 'EM_ATENDIMENTO', 'CONCLUIDO'].includes(b.status)) return false;
          const bs = timeToMinutes(b.startTime);
          const be = bs + b.frozenDurationMin;
          return windowStartMin < be && windowEndMin > bs;
        });

        const eligible = [];
        const excluded = [];

        if (!stillOccupied) {
          // Busca reservas futuras confirmadas do mesmo profissional que ocorrem DEPOIS da janela
          const futureBookings = db.bookings.filter((b) => {
            if (b.status !== 'CONFIRMADO' || b.professionalId !== cw.professionalId) return false;
            if (b.date > cw.date) return true;
            if (b.date === cw.date && timeToMinutes(b.startTime) > windowStartMin) return true;
            return false;
          });

          futureBookings.forEach((fb) => {
            const client = db.users.find((u) => u.id === fb.clientId);
            const existingOffer = db.rescheduleOffers.find(
              (o) => o.cancelledBookingId === cw.id && o.targetBookingId === fb.id
            );

            if (fb.frozenDurationMin > cw.frozenDurationMin) {
              excluded.push({
                booking: fb,
                clientName: client ? client.name : 'Cliente',
                reason: `Duração incompatível: serviço requer ${fb.frozenDurationMin} min, janela liberada tem ${cw.frozenDurationMin} min.`,
              });
              return;
            }

            if (existingOffer && existingOffer.status === 'RECUSADA') {
              excluded.push({
                booking: fb,
                clientName: client ? client.name : 'Cliente',
                reason: 'Cliente já recusou esta oferta de antecipação.',
              });
              return;
            }

            // Verifica se o horário cabe respeitando bloqueios
            const slots = getAvailableSlots(cw.professionalId, cw.date, fb.frozenDurationMin);
            if (!slots.includes(cw.startTime)) {
              excluded.push({
                booking: fb,
                clientName: client ? client.name : 'Cliente',
                reason: 'Conflito com bloqueio ou indisponibilidade na janela.',
              });
              return;
            }

            const utilizationPct = Math.round((fb.frozenDurationMin / cw.frozenDurationMin) * 100);
            eligible.push({
              booking: fb,
              clientName: client ? client.name : 'Cliente',
              existingOffer,
              utilizationPct,
              reason: `Compatível (${fb.frozenDurationMin} min cabem na janela de ${cw.frozenDurationMin} min • ${utilizationPct}% de aproveitamento). Antecipa reserva de ${formatDateBR(fb.date)} às ${fb.startTime}.`,
            });
          });

          // Ordena por melhor aproveitamento da janela
          eligible.sort((a, b) => b.utilizationPct - a.utilizationPct);
        }

        return {
          cancelledBooking: cw,
          professional: prof,
          stillOccupied,
          eligible,
          excluded,
        };
      });
    }

    function sendFlowOffer(cancelledBookingId, targetBookingId) {
      const user = getCurrentUser();
      if (!user || user.role !== 'ADMIN') return showToast('Acesso restrito ao gestor.', 'error');

      const cw = db.bookings.find((b) => b.id === cancelledBookingId);
      const tb = db.bookings.find((b) => b.id === targetBookingId && b.status === 'CONFIRMADO');
      if (!cw || !tb) return showToast('Reserva não encontrada ou inválida.', 'error');

      const alreadySent = db.rescheduleOffers.find(
        (o) => o.cancelledBookingId === cancelledBookingId && o.targetBookingId === targetBookingId && o.status === 'OFERTADA'
      );
      if (alreadySent) return showToast('Oferta já enviada para este cliente.', 'info');

      const offer = {
        id: genId('off'),
        cancelledBookingId: cw.id,
        targetBookingId: tb.id,
        clientId: tb.clientId,
        professionalId: cw.professionalId,
        serviceName: tb.frozenServiceName,
        durationMin: tb.frozenDurationMin,
        oldDate: tb.date,
        oldTime: tb.startTime,
        newDate: cw.date,
        newTime: cw.startTime,
        status: 'OFERTADA',
        createdAt: new Date().toISOString(),
      };

      db.rescheduleOffers.unshift(offer);
      pushNotification(
        tb.clientId,
        'NORDEN Flow: Horário antecipado disponível',
        `Liberou uma vaga em ${formatDateBR(cw.date)} às ${cw.startTime} para seu ${tb.frozenServiceName}. Deseja antecipar?`,
        'client_flow'
      );
      addAuditLog('ENVIAR_OFERTA_FLOW', 'RescheduleOffer', `Oferta ${offer.id} enviada ao cliente ${tb.clientId}.`);
      saveDB();
      showToast('Oferta de realocação enviada ao cliente!', 'success');
      renderApp();
    }

    function respondFlowOffer(offerId, accept) {
      const user = getCurrentUser();
      if (!user) return openAuthModal();

      const offer = db.rescheduleOffers.find((o) => o.id === offerId);
      if (!offer || offer.clientId !== user.id) return showToast('Oferta não autorizada.', 'error');
      if (offer.status !== 'OFERTADA') return showToast('Esta oferta não está mais ativa.', 'info');

      const booking = db.bookings.find((b) => b.id === offer.targetBookingId);
      if (!booking || booking.status !== 'CONFIRMADO') {
        offer.status = 'INVALIDADA';
        saveDB();
        showToast('Sua reserva original não está mais elegível.', 'error');
        return renderApp();
      }

      if (!accept) {
        offer.status = 'RECUSADA';
        pushNotification('usr_rafael', 'Oferta NORDEN Flow recusada', `${user.name} optou por manter o horário original (${formatDateBR(booking.date)} ${booking.startTime}).`, 'admin_flow');
        addAuditLog('RECUSAR_OFERTA_FLOW', 'RescheduleOffer', `Oferta ${offer.id} recusada. Reserva original preservada.`);
        saveDB();
        showToast('Oferta recusada. Seu horário original foi preservado.', 'info');
        return renderApp();
      }

      // Aceite: Revalidação atômica da disponibilidade antes de efetivar
      const availableNow = getAvailableSlots(offer.professionalId, offer.newDate, offer.durationMin, booking.id);
      if (!availableNow.includes(offer.newTime)) {
        offer.status = 'EXPIRADA';
        saveDB();
        showToast('Ops! Esta janela foi ocupada por outra reserva. Seu horário original foi mantido.', 'error');
        return renderApp();
      }

      // Efetiva a troca atomicamente
      const oldDate = booking.date;
      const oldTime = booking.startTime;
      booking.date = offer.newDate;
      booking.startTime = offer.newTime;
      booking.events = booking.events || [];
      booking.events.push({
        type: 'REALOCADO_FLOW',
        at: new Date().toISOString(),
        note: `Antecipado via NORDEN Flow de ${formatDateBR(oldDate)} ${oldTime} para ${formatDateBR(offer.newDate)} ${offer.newTime}.`,
      });

      offer.status = 'EFETIVADA';

      // Invalida outras ofertas concorrentes para a mesma janela cancelada
      db.rescheduleOffers.forEach((o) => {
        if (o.id !== offer.id && o.cancelledBookingId === offer.cancelledBookingId && o.status === 'OFERTADA') {
          o.status = 'INVALIDADA';
        }
      });

      pushNotification('usr_rafael', 'NORDEN Flow: Troca Efetivada!', `${user.name} aceitou antecipar para ${formatDateBR(offer.newDate)} às ${offer.newTime}.`, 'admin_agenda');
      addAuditLog('ACEITAR_OFERTA_FLOW', 'Booking', `Reserva ${booking.id} movida para ${offer.newDate} ${offer.newTime}.`);
      saveDB();
      showToast(`Horário antecipado com sucesso para ${formatDateBR(offer.newDate)} às ${offer.newTime}!`, 'success');
      renderApp();
    }

    function getAvailableStock(product) {
      return Math.max(0, (product.stockPhysical || 0) - (product.stockReserved || 0));
    }

    function getCartKey() {
      const user = getCurrentUser();
      return user ? user.id : 'guest';
    }

    function getCart() {
      const key = getCartKey();
      if (!db.carts[key]) db.carts[key] = [];
      return db.carts[key];
    }

    function addToCart(productId, qty = 1) {
      const product = db.products.find((p) => p.id === productId);
      if (!product || !product.active) return showToast('Produto indisponível no catálogo.', 'error');

      const avail = getAvailableStock(product);
      const cart = getCart();
      const existing = cart.find((i) => i.productId === productId);
      const nextQty = (existing ? existing.qty : 0) + qty;

      if (nextQty > avail) {
        return showToast(`Estoque insuficiente. Disponível: ${avail} un.`, 'error');
      }

      if (existing) {
        existing.qty = nextQty;
      } else {
        cart.push({ productId, qty });
      }
      saveDB();
      updateHeaderUI();
      renderCartDrawer();
      showToast(`${product.name} adicionado ao carrinho.`, 'success');
    }

    function updateCartQty(productId, delta) {
      const cart = getCart();
      const idx = cart.findIndex((i) => i.productId === productId);
      if (idx === -1) return;

      const product = db.products.find((p) => p.id === productId);
      const avail = product && product.active ? getAvailableStock(product) : 0;
      const nextQty = cart[idx].qty + delta;

      if (nextQty <= 0) {
        cart.splice(idx, 1);
      } else if (nextQty > avail) {
        return showToast(`Limite de estoque disponível (${avail} un.) atingido.`, 'error');
      } else {
        cart[idx].qty = nextQty;
      }

      saveDB();
      updateHeaderUI();
      renderCartDrawer();
    }

    function calculateDeliveryFeeCents(distanceKm) {
      const s = db.settings;
      const dist = Number(distanceKm) || 0;
      if (dist <= 0) return { allowed: false, feeCents: 0, error: 'Informe uma distância válida.' };
      if (dist > s.deliveryMaxKm) {
        return {
          allowed: false,
          feeCents: 0,
          error: `Distância (${dist} km) excede o raio máximo de entrega (${s.deliveryMaxKm} km). Opte pela Retirada no Salão (taxa R$ 0,00).`,
        };
      }
      const raw = (s.deliveryBaseCents || 0) + Math.round(dist * (s.deliveryRateCentsPerKm || 250));
      const feeCents = Math.max(s.deliveryMinCents || 0, raw);
      return { allowed: true, feeCents, error: null };
    }

      const user = getCurrentUser();
      db.inventoryMovements.unshift({

      });
    }

    function loginAsDemo(userId) {
      const target = db.users.find((u) => u.id === userId);
      if (!target) return;

      // Mescla carrinho de visitante se entrar como cliente
      if (target.role === 'CLIENT' && db.carts.guest && db.carts.guest.length > 0) {
        db.carts[target.id] = db.carts[target.id] || [];
        db.carts.guest.forEach((gi) => {
          const ex = db.carts[target.id].find((i) => i.productId === gi.productId);
          if (ex) ex.qty += gi.qty;
          else db.carts[target.id].push({ ...gi });
        });
        db.carts.guest = [];
      }

      db.sessionUserId = target.id;
      addAuditLog('LOGIN_DEMO', 'Session', `Sessão iniciada como ${target.name} (${target.role}).`);

      closeModal();
      showToast(`Bem-vindo, ${target.name}.`, 'success');

      else navigate('client_home');
    }

          </div>
        `;
        footer.innerHTML = '';

    function confirmCheckoutOrder() {
      const user = getCurrentUser();
      const cart = getCart();
      if (!user || cart.length === 0) return;

      // Revalidação atômica de estoque e produtos ativos
      for (const item of cart) {
        const p = db.products.find((pr) => pr.id === item.productId);
        if (!p || !p.active) return showToast(`O produto não está mais disponível.`, 'error');
        if (item.qty > getAvailableStock(p)) {
          return showToast(`Estoque insuficiente para ${p.name}. Disponível: ${getAvailableStock(p)}.`, 'error');
        }
      }

      let deliveryFeeCents = 0;
      let frozenAddress = null;
      if (checkoutState.modality === 'ENTREGA') {
        if (!checkoutState.street.trim() || !checkoutState.number.trim() || !checkoutState.cep.trim()) {
          return showToast('Preencha rua, número e CEP para entrega.', 'error');
        }
        const calc = calculateDeliveryFeeCents(checkoutState.distanceKm);
        if (!calc.allowed) return showToast(calc.error, 'error');
        deliveryFeeCents = calc.feeCents;
        frozenAddress = `${checkoutState.street}, ${checkoutState.number} - ${checkoutState.neighborhood} (CEP ${checkoutState.cep})`;
      }

      // Reserva estoque atomicamente e congela itens
      let subtotalCents = 0;
      const orderItems = cart.map((item) => {
        const p = db.products.find((pr) => pr.id === item.productId);
        p.stockReserved = (p.stockReserved || 0) + item.qty;
        recordInventoryMovement(p, 'RESERVA', item.qty, 'Reserva automática na criação de pedido');
        subtotalCents += p.priceCents * item.qty;
        return {
          productId: p.id,
          name: p.name,
          unitPriceCents: p.priceCents,
          qty: item.qty,
        };
      });

      const orderCode = 'NRD-' + String(Math.floor(10000 + Math.random() * 90000));
      const newOrder = {
        id: genId('ord'),
        code: orderCode,
        clientId: user.id,
        clientName: user.name,
        items: orderItems,
        modality: checkoutState.modality,
        address: frozenAddress,
        distanceKm: checkoutState.modality === 'ENTREGA' ? checkoutState.distanceKm : 0,
        subtotalCents,
        deliveryFeeCents,
        totalCents: subtotalCents + deliveryFeeCents,
        status: 'RECEBIDO',
        paymentStatus: 'SIMULADO',
        stockConsumed: false,
        stockReleased: false,
        createdAt: new Date().toISOString(),
        events: [
          { status: 'RECEBIDO', at: new Date().toISOString(), note: 'Pedido demonstrativo registrado e estoque reservado.' },
        ],
      };

      db.orders.unshift(newOrder);
      db.carts[user.id] = []; // Limpa carrinho

      pushNotification(user.id, `Pedido ${orderCode} recebido`, `Seu pedido (${checkoutState.modality}) foi registrado com sucesso.`, 'client_orders');
      pushNotification('usr_rafael', `Novo pedido ${orderCode}`, `${user.name} realizou um pedido (${formatBRL(newOrder.totalCents)} - Simulado).`, 'admin_orders');
      addAuditLog('CRIAR_PEDIDO', 'Order', `Pedido ${orderCode} criado (${checkoutState.modality}). Estoque reservado.`);

      saveDB();
      closeModal();
      updateHeaderUI();
      showToast(`Pedido ${orderCode} confirmado! Acompanhe em Meus Pedidos.`, 'success');
      navigate('client_orders');
    }

    function toggleBookingPreferredProduct(prodId) {
      const idx = bookingDraft.preferredProductIds.indexOf(prodId);
      if (idx === -1) bookingDraft.preferredProductIds.push(prodId);
      else bookingDraft.preferredProductIds.splice(idx, 1);
      renderApp();
    }

    function confirmBooking() {
      const user = getCurrentUser();
      const srv = db.services.find((s) => s.id === bookingDraft.serviceId && s.active);
      const prof = db.professionals.find((p) => p.id === bookingDraft.professionalId && p.active);
      if (!user || !srv || !prof || !bookingDraft.startTime) return showToast('Dados incompletos.', 'error');

      // Revalidação atômica contra sobreposição
      const validSlots = getAvailableSlots(prof.id, bookingDraft.date, srv.durationMin);
      if (!validSlots.includes(bookingDraft.startTime)) {
        return showToast('Este horário acabou de ser ocupado. Selecione outro.', 'error');
      }

      const newBooking = {
        id: genId('bk'),
        clientId: user.id,
        professionalId: prof.id,
        serviceId: srv.id,
        frozenServiceName: srv.name,
        frozenPriceCents: srv.priceCents,
        frozenDurationMin: srv.durationMin,
        date: bookingDraft.date,
        startTime: bookingDraft.startTime,
        status: 'CONFIRMADO',
        preferredProductIds: [...bookingDraft.preferredProductIds],
        createdAt: new Date().toISOString(),
        events: [
          { type: 'CRIADO', at: new Date().toISOString(), note: 'Reserva confirmada online.' },
        ],
      };

      db.bookings.unshift(newBooking);
      pushNotification(user.id, 'Agendamento confirmado', `${srv.name} com ${prof.name} em ${formatDateBR(newBooking.date)} às ${newBooking.startTime}.`, 'client_bookings');
      pushNotification('usr_rafael', 'Novo agendamento', `${user.name} agendou ${srv.name} em ${formatDateBR(newBooking.date)} às ${newBooking.startTime}.`, 'admin_agenda');
      addAuditLog('CRIAR_RESERVA', 'Booking', `Reserva ${newBooking.id} criada para ${newBooking.date} ${newBooking.startTime}.`);
      saveDB();

      bookingDraft = { step: 1, serviceId: null, professionalId: null, preferredProductIds: [], date: getTodayISO(1), startTime: null };
      showToast('Agendamento confirmado com sucesso!', 'success');
      navigate('client_bookings');
    }

    // --- MEUS AGENDAMENTOS ---
    function renderClientBookings() {
      const user = getCurrentUser();
      const myBookings = db.bookings
        .filter((b) => b.clientId === user.id)
        .sort((a, b) => (b.date + b.startTime).localeCompare(a.date + a.startTime));

      return renderClientShell(
        'client_bookings',
        `
        <div class="flex items-center justify-between mb-6">
          <h1 class="font-display text-2xl font-semibold text-stone-soft">Meus Agendamentos</h1>
          <button onclick="startBookingFlow()" class="px-4 py-2 rounded-lg bg-bronze text-onix font-display text-xs font-bold uppercase tracking-wider">+ Agendar</button>
        </div>

        ${myBookings.length === 0 ? `
          <div class="p-12 text-center rounded-2xl bg-grafite border hairline">

                      <div class="flex items-center gap-2.5 mb-1.5">
                        ${renderStatusBadge(b.status)}

                      <p class="text-xs text-taupe mt-1">Profissional: ${escapeHTML(prof ? prof.name : '-')} • ${b.frozenDurationMin} min • ${formatBRL(b.frozenPriceCents)}</p>
                    </div>
                    <div class="flex items-center gap-2.5">
                      ${b.status === 'CONFIRMADO' ? `
                        <button onclick="promptCancelBooking('${b.id}')" class="px-4 py-2 rounded-lg border border-red-500/40 text-red-300 hover:bg-red-950/50 text-xs transition">Cancelar</button>
                      ` : ''}
                      ${b.status === 'CONCLUIDO' ? `
                        <button onclick="navigate('client_journey')" class="px-4 py-2 rounded-lg border hairline-bronze text-bronze-pale hover:bg-bronze/10 text-xs transition">Ver na Journey</button>

    function promptCancelBooking(bookingId) {
      openModal(`
        <div class="p-6">
          <h3 class="font-display text-lg font-semibold text-stone-soft mb-2">Cancelar Reserva?</h3>
          <p class="text-xs text-taupe leading-relaxed mb-4">Ao cancelar, o horário será liberado e o motor <strong>NORDEN Flow</strong> poderá sugerir o encaixe para outros clientes compatíveis.</p>
          <input id="cancel-reason-input" type="text" placeholder="Motivo opcional (ex: Imprevisto)" class="w-full px-3.5 py-2.5 rounded-lg bg-onix border hairline text-xs text-stone-soft mb-5" />
          <div class="flex justify-end gap-3">
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg border hairline text-xs text-taupe hover:text-stone-soft">Voltar</button>
            <button onclick="executeCancelBooking('${bookingId}')" class="px-4 py-2 rounded-lg bg-red-600/80 hover:bg-red-600 text-white text-xs font-semibold">Confirmar Cancelamento</button>
          </div>
        </div>
      `);
    }

    function executeCancelBooking(bookingId) {
      const user = getCurrentUser();
      const b = db.bookings.find((item) => item.id === bookingId);
      if (!b || (user.role !== 'ADMIN' && b.clientId !== user.id)) return showToast('Ação não autorizada.', 'error');
      if (b.status !== 'CONFIRMADO') return showToast('Apenas reservas confirmadas podem ser canceladas.', 'error');

      const reason = document.getElementById('cancel-reason-input')?.value.trim() || 'Cancelado pelo usuário';
      b.status = 'CANCELADO';
      b.cancelReason = reason;
      b.events = b.events || [];
      b.events.push({ type: 'CANCELADO', at: new Date().toISOString(), note: reason });

      pushNotification('usr_rafael', 'Cancelamento — NORDEN Flow ativo', `Janela de ${b.frozenDurationMin} min liberada em ${formatDateBR(b.date)} às ${b.startTime}. Confira encaixes sugeridos.`, 'admin_flow');
      addAuditLog('CANCELAR_RESERVA', 'Booking', `Reserva ${b.id} cancelada. Janela liberada para NORDEN Flow.`);
      saveDB();
      closeModal();
      showToast('Reserva cancelada. Janela liberada no NORDEN Flow.', 'info');
      renderApp();
    }

    // --- EXECUÇÃO DO ATENDIMENTO PROFISSIONAL (JOURNEY + CARE SNAPSHOT) ---
    function openAttendanceScreen(bookingId) {
      const b = db.bookings.find((item) => item.id === bookingId);
      if (!b) return;
      if (b.status === 'CONFIRMADO') {
        b.status = 'EM_ATENDIMENTO';
        b.events.push({ type: 'EM_ATENDIMENTO', at: new Date().toISOString(), note: 'Atendimento iniciado pelo profissional.' });
        saveDB();
      }
      activeAttendanceBookingId = bookingId;
      navigate('admin_attendance');
    }

      const b = db.bookings.find((item) => item.id === activeAttendanceBookingId);
      if (!b) return renderAdminShell('admin_agenda', `<p class="text-sm text-taupe">Selecione uma reserva na agenda.</p>`);

      const client = db.users.find((u) => u.id === b.clientId);
      const safety = client && client.safety ? client.safety : { allergyStatus: 'NAO_SEI' };
      const template = db.careTemplates.find((t) => t.serviceId === b.serviceId) || db.careTemplates[0];
      const prefNames = (b.preferredProductIds || []).map((id) => (db.products.find((p) => p.id === id) || {}).name).filter(Boolean);

      return renderAdminShell(
        'admin_agenda',
        `
        <form onsubmit="completeAttendanceSubmit(event, '${b.id}')" class="space-y-6">

    function completeAttendanceSubmit(e, bookingId) {
      e.preventDefault();
      // Idempotência: impede conclusão duplicada
      if (db.appointments.some((a) => a.bookingId === bookingId)) {
        return showToast('Este atendimento já foi concluído anteriormente.', 'info');
      }

      const b = db.bookings.find((item) => item.id === bookingId);
      if (!b || b.status === 'CANCELADO') return showToast('Reserva inválida para conclusão.', 'error');

      const usedIds = [...document.querySelectorAll('input[name="used_products"]:checked')].map((el) => el.value);
      const recIds = [...document.querySelectorAll('input[name="rec_products"]:checked')].map((el) => el.value);
      const template = db.careTemplates.find((t) => t.serviceId === b.serviceId) || db.careTemplates[0];
      const prof = db.professionals.find((p) => p.id === b.professionalId);

      const newApt = {
        id: genId('apt'),
        bookingId: b.id,
        clientId: b.clientId,
        professionalId: b.professionalId,
        serviceName: b.frozenServiceName,
        date: b.date,
        durationMin: b.frozenDurationMin,
        startedAt: new Date(Date.now() - b.frozenDurationMin * 60000).toISOString(),
        completedAt: new Date().toISOString(),
        usedProducts: usedIds.map((id) => {
          const p = db.products.find((pr) => pr.id === id);
          return { productId: id, name: p ? p.name : 'Produto', note: 'Utilizado durante o atendimento.' };
        }),
        recommendedProducts: recIds.map((id) => {
          const p = db.products.find((pr) => pr.id === id);
          return { productId: id, name: p ? p.name : 'Produto', reason: 'Recomendado pelo profissional para manutenção.' };
        }),
        clientNotes: document.getElementById('att-client-notes').value.trim(),
        privateNotes: document.getElementById('att-private-notes').value.trim(),
        nextReturnSuggestion: '25 dias',
        careSnapshot: {
          templateId: template.id,
          version: template.version,
          title: template.title,
          first24h: document.getElementById('care-24h').value.trim(),
          avoid: document.getElementById('care-avoid').value.trim(),
          maintenance: document.getElementById('care-maint').value.trim(),
          reviewedBy: prof ? prof.name : 'Profissional NORDEN',
          frozenAt: new Date().toISOString(),
        },
      };

      b.status = 'CONCLUIDO';
      b.events.push({ type: 'CONCLUIDO', at: new Date().toISOString(), note: 'Atendimento concluído e manual congelado.' });
      db.appointments.unshift(newApt);

      pushNotification(b.clientId, 'Atendimento concluído — NORDEN Journey', `Seu histórico e manual NORDEN Care de ${b.frozenServiceName} já estão disponíveis.`, 'client_journey');
      addAuditLog('CONCLUIR_ATENDIMENTO', 'Appointment', `Atendimento ${newApt.id} concluído com snapshot de manual v${template.version}.`);
      saveDB();
      showToast('Atendimento concluído e enviado para a Journey do cliente!', 'success');
      navigate('admin_agenda');
    }

    function getAllowedOrderTransitions(order) {
      if (order.status === 'CONCLUIDO' || order.status === 'CANCELADO') return [];
      if (order.status === 'RECEBIDO') return ['EM_PREPARACAO', 'CANCELADO'];
      if (order.status === 'EM_PREPARACAO') {
        return order.modality === 'RETIRADA' ? ['PRONTO_RETIRADA', 'CANCELADO'] : ['SAIU_ENTREGA', 'CANCELADO'];
      }
      if (order.status === 'PRONTO_RETIRADA' || order.status === 'SAIU_ENTREGA') return ['CONCLUIDO'];
      return [];
    }

    function transitionOrderStatus(orderId, nextStatus) {
      const o = db.orders.find((ord) => ord.id === orderId);
      if (!o) return;
      const allowed = getAllowedOrderTransitions(o);
      if (!allowed.includes(nextStatus)) return showToast('Transição incompatível com a modalidade/status atual.', 'error');

      // Baixa definitiva do estoque na expedição/retirada (uma única vez)
      if ((nextStatus === 'SAIU_ENTREGA' || nextStatus === 'PRONTO_RETIRADA' || nextStatus === 'CONCLUIDO') && !o.stockConsumed) {
        o.items.forEach((item) => {
          const p = db.products.find((pr) => pr.id === item.productId);
          if (p) {
            p.stockReserved = Math.max(0, (p.stockReserved || 0) - item.qty);
            p.stockPhysical = Math.max(0, (p.stockPhysical || 0) - item.qty);
            recordInventoryMovement(p, 'SAIDA_VENDA', item.qty, `Baixa por expedição do pedido ${o.code}`);
          }
        });
        o.stockConsumed = true;
      }

      // Liberação de reserva no cancelamento antes da baixa (uma única vez)
      if (nextStatus === 'CANCELADO' && !o.stockConsumed && !o.stockReleased) {
        o.items.forEach((item) => {
          const p = db.products.find((pr) => pr.id === item.productId);
          if (p) {
            p.stockReserved = Math.max(0, (p.stockReserved || 0) - item.qty);
            recordInventoryMovement(p, 'LIBERACAO', item.qty, `Liberação por cancelamento do pedido ${o.code}`);
          }
        });
        o.stockReleased = true;
      }

      o.status = nextStatus;
      o.events.push({ status: nextStatus, at: new Date().toISOString(), note: `Atualizado pelo gestor.` });
      pushNotification(o.clientId, `Pedido ${o.code} atualizado`, `Novo status: ${nextStatus.replace('_', ' ')}.`, 'client_orders');
      addAuditLog('ATUALIZAR_PEDIDO', 'Order', `Pedido ${o.code} alterado para ${nextStatus}.`);
      saveDB();
      showToast(`Pedido ${o.code} atualizado para ${nextStatus}.`, 'success');
      renderApp();
    }

      saveDB();
      showToast(`Estoque de ${p.name} atualizado (+${delta}).`, 'success');

                  <textarea id="tpl-mt-${t.id}" rows="2" class="w-full px-3 py-2 rounded-lg bg-onix border hairline text-xs text-stone-soft">${escapeHTML(t.maintenance)}</textarea>
                </div>
                <button type="submit" class="px-4 py-2 rounded-lg bg-bronze hover:bg-bronze-light text-onix font-display text-xs font-bold uppercase tracking-wider">Salvar Nova Versão</button>
              </form>
            `
              )
              .join('')}
          </div>
        </div>
        `
      );
    }

    function saveCareTemplate(e, templateId) {
      e.preventDefault();
      const t = db.careTemplates.find((ct) => ct.id === templateId);
      if (!t) return;
      t.first24h = document.getElementById(`tpl-24-${t.id}`).value.trim();
      t.maintenance = document.getElementById(`tpl-mt-${t.id}`).value.trim();
      t.version += 1;
      t.updatedAt = new Date().toISOString();
      addAuditLog('EDITAR_MANUAL', 'CareTemplate', `Modelo ${t.title} atualizado para v${t.version}.`);
      saveDB();
      showToast(`Modelo atualizado para v${t.version}. Atendimentos anteriores permanecem preservados.`, 'success');
      renderApp();
    }

    // --- CONFIGURAÇÕES & AUDITORIA ---
    function renderAdminSettings() {
      const s = db.settings;
      return renderAdminShell(
        'admin_settings',
        `
        <div class="space-y-8">
          <div>
            <h1 class="font-display text-2xl font-semibold text-stone-soft">Configurações &amp; Auditoria</h1>
          </div>

          <form onsubmit="saveAdminSettings(event)" class="p-6 rounded-2xl bg-grafite border hairline space-y-4">
            <h2 class="font-display text-sm uppercase tracking-wider text-bronze-pale">Parâmetros de Entrega (Demonstrativos)</h2>
            <div class="grid sm:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs text-taupe mb-1">Tarifa por km (centavos)</label>
                <input id="set-rate" type="number" min="0" value="${s.deliveryRateCentsPerKm}" class="w-full px-3 py-2 rounded-lg bg-onix border hairline text-sm text-stone-soft" />
                <span class="text-[10px] text-taupe">Atual: ${formatBRL(s.deliveryRateCentsPerKm)}/km</span>
              </div>
              <div>
                <label class="block text-xs text-taupe mb-1">Raio Máximo (km)</label>
                <input id="set-maxkm" type="number" min="1" value="${s.deliveryMaxKm}" class="w-full px-3 py-2 rounded-lg bg-onix border hairline text-sm text-stone-soft" />
              </div>
              <div>
                <label class="block text-xs text-taupe mb-1">Taxa Mínima (centavos)</label>
                <input id="set-min" type="number" min="0" value="${s.deliveryMinCents}" class="w-full px-3 py-2 rounded-lg bg-onix border hairline text-sm text-stone-soft" />
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
              <button type="submit" class="px-5 py-2.5 rounded-lg bg-bronze hover:bg-bronze-light text-onix font-display text-xs font-bold uppercase tracking-wider">Salvar Parâmetros</button>
              <button type="button" onclick="resetDemoData()" class="px-4 py-2.5 rounded-lg border border-red-500/40 text-red-300 hover:bg-red-950/50 text-xs transition">Resetar Dados Demo</button>
            </div>
          </form>

          <!-- Log de Auditoria -->
          <div class="p-6 rounded-2xl bg-grafite border hairline">
            <h2 class="font-display text-sm uppercase tracking-wider text-stone-soft mb-4">Log de Auditoria Recente</h2>
            <div class="space-y-2 max-h-72 overflow-y-auto">
              ${db.auditLogs
                .slice(0, 20)
                .map(
                  (l) => `
                <div class="p-3 rounded-lg bg-onix border hairline flex flex-wrap justify-between gap-2 text-xs">
                  <div>
                    <span class="text-bronze-pale font-mono text-[11px]">${l.action}</span>
                    <span class="text-stone-soft ml-2">${escapeHTML(l.summary)}</span>
                  </div>
                  <span class="text-[10px] text-taupe">${escapeHTML(l.author)} • ${formatDateTimeBR(l.at)}</span>
                </div>
              `
                )
                .join('')}
            </div>
          </div>
        </div>
        `
      );
    }

    function saveAdminSettings(e) {
      e.preventDefault();
      db.settings.deliveryRateCentsPerKm = Number(document.getElementById('set-rate').value) || 0;
      db.settings.deliveryMaxKm = Number(document.getElementById('set-maxkm').value) || 15;
      db.settings.deliveryMinCents = Number(document.getElementById('set-min').value) || 0;
      addAuditLog('ATUALIZAR_CONFIG', 'Settings', `Tarifa entrega: ${formatBRL(db.settings.deliveryRateCentsPerKm)}/km, raio ${db.settings.deliveryMaxKm}km.`);
      saveDB();
      showToast('Parâmetros comerciais atualizados.', 'success');
      renderApp();
    }

    // --------------------------------------------------------------------------
    // 16. COMPONENTES AUXILIARES & LOOP DE RENDERIZAÇÃO
    // --------------------------------------------------------------------------
    function renderStatusBadge(status) {
      const map = {
        CONFIRMADO: 'bg-bronze/20 text-bronze-pale border-bronze/40',
        EM_ATENDIMENTO: 'bg-amber-950/60 text-amber-300 border-amber-500/40',
        CONCLUIDO: 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40',
        CANCELADO: 'bg-red-950/60 text-red-300 border-red-500/40',
        OFERTADA: 'bg-bronze/25 text-bronze-pale border-bronze',
        EFETIVADA: 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40',
        RECUSADA: 'bg-onix text-taupe border-taupe/30',
        RECEBIDO: 'bg-bronze/20 text-bronze-pale border-bronze/40',
        EM_PREPARACAO: 'bg-amber-950/60 text-amber-300 border-amber-500/40',
        PRONTO_RETIRADA: 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40',
        SAIU_ENTREGA: 'bg-emerald-950/60 text-emerald-300 border-emerald-500/40',
      };
      const cls = map[status] || 'bg-onix text-taupe border-taupe/30';
      return `<span class="text-[10px] font-display font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full border ${cls}">${String(status).replace(/_/g, ' ')}</span>`;
    }

    function renderApp() {
      updateHeaderUI();
      const root = document.getElementById('app-root');

      try {
        switch (currentView) {
          case 'landing':
            root.innerHTML = renderLanding();
            break;
          case 'store':
            root.innerHTML = renderStore();
            break;
          case 'client_home':
            root.innerHTML = renderClientHome();
            break;
          case 'client_book':
            root.innerHTML = renderClientBookingFlow();
            break;
          case 'client_bookings':
            root.innerHTML = renderClientBookings();
            break;
          case 'client_flow':
            root.innerHTML = renderClientFlow();
            break;
          case 'client_journey':
            root.innerHTML = renderClientJourney();
            break;
          case 'client_orders':
            root.innerHTML = renderClientOrders();
            break;
          case 'client_profile':
            root.innerHTML = renderClientProfile();
            break;
          case 'admin_dashboard':
            root.innerHTML = renderAdminDashboard();
            break;
          case 'admin_agenda':
            root.innerHTML = renderAdminAgenda();
            break;
          case 'admin_attendance':
            root.innerHTML = renderAdminAttendance();
            break;
          case 'admin_flow':
            root.innerHTML = renderAdminFlow();
            break;
          case 'admin_orders':
            root.innerHTML = renderAdminOrders();
            break;
          case 'admin_catalog':
            root.innerHTML = renderAdminCatalog();
            break;
          case 'admin_care':
            root.innerHTML = renderAdminCare();
            break;
          case 'admin_settings':
            root.innerHTML = renderAdminSettings();
            break;
          default:
            root.innerHTML = renderLanding();
        }
      } catch (err) {
        console.error('Erro ao renderizar view:', err);
        root.innerHTML = `<div class="max-w-lg mx-auto my-20 p-8 rounded-2xl bg-grafite border hairline text-center"><p class="text-sm text-stone-soft">Ocorreu um erro inesperado ao carregar a tela.</p><button onclick="navigate('landing')" class="mt-4 px-4 py-2 rounded-lg bg-bronze text-onix text-xs font-bold">Voltar ao Início</button></div>`;
      }
    }

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
