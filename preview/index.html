<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../norden/public/assets/norden-emblem.svg" />
    <title>NORDEN — Salão Masculino Premium</title>
    <meta
      name="description"
      content="Demonstração interativa do NORDEN com dados fictícios para explorar agenda, Journey, Care, Flow e loja."
    />
    <meta property="og:title" content="NORDEN — Salão Masculino Premium" />
    <meta
      property="og:description"
      content="Explore a demonstração interativa do NORDEN. Reservas e pedidos simulados ficam no navegador."
    />
    <meta property="og:image" content="https://da0602766-byte.github.io/NORDEN/assets/images/hero_norden_salon.webp" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('norden_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-[#8E6B47]/30 selection:text-[var(--text-primary)]">
    <noscript>Ative o JavaScript para consultar os serviços e a loja NORDEN.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
